<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Teleprompter Editor</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
}
.container {
  padding: 20px;
}
textarea {
  width: 100%;
  height: 300px;
  padding: 15px;
  font-size: 16px;
}
button {
  padding: 12px;
  margin-top: 10px;
  width: 100%;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">
<h2>Teleprompter Script</h2>

<textarea id="script" placeholder="Paste your script..."></textarea>

<label>Countdown (seconds):</label>
<input type="number" id="countdown" value="3" min="0" max="10">

<button onclick="save()">💾 Save</button>
<button onclick="load()">📂 Load</button>
<button onclick="start()">▶ Start Prompter</button>
</div>

<script>
function save(){
  localStorage.setItem("tp_script", script.value);
}

function load(){
  script.value = localStorage.getItem("tp_script") || "";
}

function start(){
  localStorage.setItem("tp_data", JSON.stringify({
    script: script.value,
    countdown: countdown.value
  }));
  window.open("prompter.html");
}
</script>
</body>
</html>
